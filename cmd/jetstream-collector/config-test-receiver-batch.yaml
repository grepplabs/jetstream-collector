exporters:
  nop:

receivers:
  jetstream/receiver-batch:
    url: nats://127.0.0.1:30422
    stream: LOGS_INPUT
    subject: logs.input
    consumer_name: receiver-batch
    processing_mode: batch
    batch_max_messages: 32
    batch_max_wait: 500ms
    workers: 32
    bootstrap:
      consumer: { }

service:
  pipelines:
    logs/receiver-batch:
      receivers:
        - jetstream/receiver-batch
      exporters:
        - nop

  telemetry:
    resource:
      service.name: jetstream-collector
      service.version: "0.0.0-test"
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
