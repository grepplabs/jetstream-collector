type: s3jetstream
scope_name: github.com/grepplabs/jetstream-collector/receiver/s3jetstreamreceiver
github_project: grepplabs/jetstream-collector

status:
  class: receiver
  stability:
    alpha: [ logs, metrics, traces, profiles ]

tests:
  config:
    s3:
      endpoint: http://localhost:9000
      bucket: otlp
      credentials:
        access_key_id: minio
        secret_access_key: minio-secret
    jetstream:
      url: nats://localhost:4222
      stream: OTLP
      consumer: otlp-traces
      subject: otlp.traces
    cleanup:
      subject: otlp.delete
    signal: traces
    bootstrap:
      stream:
        name: OTLP
        subjects: [ otlp.traces ]
      consumer:
        name: otlp-traces
        filter_subject: otlp.traces
