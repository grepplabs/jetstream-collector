services:
  nats:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: -c /etc/nats/nats.conf
    ports:
      - "4222:4222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s

  nats-tls:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: -c /etc/nats/nats-tls.conf
    ports:
      - "4223:4222"
    volumes:
      - ./nats-tls.conf:/etc/nats/nats-tls.conf:ro
      - ./cfssl/certs:/etc/nats/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s

  nats-core:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: -c /etc/nats/nats.conf
    ports:
      - "4224:4222"
      - "8224:8222"
    volumes:
      - ./nats-core.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s

  nats-edge-01:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: -c /etc/nats/nats.conf
    ports:
      - "4225:4222"
      - "8225:8222"
    volumes:
      - ./nats-edge-01.conf:/etc/nats/nats.conf:ro
    depends_on:
      nats-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s

  nats-edge-02:
    image: nats:2.14.3-alpine
    restart: unless-stopped
    command: -c /etc/nats/nats.conf
    ports:
      - "4226:4222"
      - "8226:8222"
    volumes:
      - ./nats-edge-02.conf:/etc/nats/nats.conf:ro
    depends_on:
      nats-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 5s
