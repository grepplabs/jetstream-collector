apiVersion: v1
kind: Service
metadata:
  name: seaweed-s3-gateway
  namespace: seaweedfs-cluster
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: s3
    app.kubernetes.io/instance: seaweed
    app.kubernetes.io/name: seaweedfs
  ports:
    - name: s3-http
      protocol: TCP
      port: 8333
      targetPort: 8333
      nodePort: 30333
