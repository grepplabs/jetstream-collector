apiVersion: v1
kind: Service
metadata:
  name: tenant-collector-nodeport
  namespace: collectors
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: opentelemetry-collector
    app.kubernetes.io/instance: collectors.tenant
    app.kubernetes.io/managed-by: opentelemetry-operator
    app.kubernetes.io/part-of: opentelemetry
  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
      nodePort: 30517
      appProtocol: kubernetes.io/h2c
    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318
      nodePort: 30518
