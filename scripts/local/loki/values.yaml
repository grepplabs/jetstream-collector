fullnameOverride: loki

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true

  storage:
    type: s3

    bucketNames:
      chunks: loki
      ruler: loki

    s3:
      endpoint: http://seaweed-s3.seaweedfs-cluster.svc.cluster.local:8333
      region: eu-central-1
      accessKeyId: ${S3_ACCESS_KEY}
      secretAccessKey: ${S3_SECRET_KEY}
      s3ForcePathStyle: true
      insecure: true

  ingester:
    chunk_idle_period: 20s
    max_chunk_age: 30s
    flush_check_period: 10s

    wal:
      enabled: true
      flush_on_shutdown: true

singleBinary:
  replicas: 1

  extraArgs:
    - -config.expand-env=true

  extraEnv:
    - name: S3_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: accessKey

    - name: S3_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-credentials
          key: secretKey

  persistence:
    enabled: true
    size: 10Gi
    storageClass: standard
    accessModes:
      - ReadWriteOnce

gateway:
  enabled: true
  replicas: 1
  affinity: null

  #basicAuth:
  #  enabled: true
  #  username: loki
  #  password: loki123

  # htpasswd -nbB loki loki123
  users:
    - username: loki
      passwordHash: "$2y$05$j3b1J2cLbLOHyxszzi6ElerWYaNIF2EhWw0Zr37zG7E2HNeyNR19W"

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

test:
  enabled: false

minio:
  enabled: false

lokiCanary:
  enabled: false
