apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: loki
  namespace: loki
spec:
  clusterRef:
    name: seaweed
    namespace: seaweedfs-cluster
  reclaimPolicy: Delete

---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Identity
metadata:
  name: loki
  namespace: loki
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs-cluster
  name: loki
  reclaimPolicy: Delete

---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Credentials
metadata:
  name: loki
  namespace: loki
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs-cluster
  identityRef:
    name: loki
  secretRef:
    name: loki-s3-credentials
  reclaimPolicy: Delete

---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3Policy
metadata:
  name: loki-read-write
  namespace: loki
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs-cluster
  reclaimPolicy: Delete
  statements:
    - effect: Allow
      actions:
        - s3:ListBucket
        - s3:GetBucketLocation
        - s3:ListBucketMultipartUploads
      resources:
        - loki

    - effect: Allow
      actions:
        - s3:GetObject
        - s3:GetObjectVersion
        - s3:PutObject
        - s3:DeleteObject
        - s3:DeleteObjectVersion
        - s3:GetObjectTagging
        - s3:PutObjectTagging
        - s3:DeleteObjectTagging
        - s3:AbortMultipartUpload
        - s3:ListMultipartUploadParts
      resources:
        - loki/*

---
apiVersion: seaweed.seaweedfs.com/v1
kind: S3PolicyBinding
metadata:
  name: loki
  namespace: loki
spec:
  seaweedRef:
    name: seaweed
    namespace: seaweedfs-cluster
  policyRef:
    name: loki-read-write
  subjects:
    - kind: S3Identity
      name: loki
  reclaimPolicy: Delete
