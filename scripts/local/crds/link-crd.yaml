apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: links.api.hub.acme.cloud
spec:
  group: api.hub.acme.cloud
  scope: Namespaced
  names:
    plural: links
    singular: link
    kind: Link
    listKind: LinkList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: TenantId
          type: string
          jsonPath: .spec.tenantId
        - name: ResourceId
          type: string
          jsonPath: .metadata.labels.acme\.cloud/resource-id
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                tenantId:
                  type: string
                  format: uuid
              required:
                - tenantId
