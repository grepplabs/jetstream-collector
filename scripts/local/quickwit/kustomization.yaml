apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - s3-quickwit-grant.yaml
  - s3-quickwit.yaml

helmCharts:
  - name: postgresql
    repo: https://charts.bitnami.com/bitnami
    version: 18.8.1
    releaseName: postgresql
    namespace: quickwit
    valuesInline:
      auth:
        username: quickwit
        password: quickwit
        database: quickwit
  - name: quickwit
    repo: https://helm.quickwit.io
    version: 0.8.12
    releaseName: quickwit
    namespace: quickwit
    valuesFile: values.yaml

patches:
  - target:
      labelSelector: app.kubernetes.io/instance=quickwit
    patch: |-
      - op: add
        path: /metadata/namespace
        value: quickwit

  - target:
      labelSelector: app.kubernetes.io/instance=postgresql
    patch: |-
      - op: add
        path: /metadata/namespace
        value: quickwit