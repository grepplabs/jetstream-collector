apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: nats
    repo: https://nats-io.github.io/k8s/helm/charts
    version: 2.14.2
    releaseName: nats
    namespace: nats
    valuesFile: values.yaml
patches:
  # delete the test pod. it is not needed for the local setup and it almost always fails
  - target:
      group: ""
      version: v1
      kind: Pod
      name: nats-test-request-reply
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: nats-test-request-reply
      $patch: delete
