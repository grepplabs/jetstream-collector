apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

helmCharts:
  - name: openbao
    repo: https://openbao.github.io/openbao-helm
    version: 0.29.2
    releaseName: openbao
    namespace: openbao
    valuesInline:
      server:
        dev:
          enabled: true
        service:
          type: NodePort
          nodePort: 30200

patches:
  - target:
      kind: Pod
      name: openbao-server-test
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Pod
      metadata:
        name: openbao-server-test
