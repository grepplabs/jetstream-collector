apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: nack
    repo: https://nats-io.github.io/k8s/helm/charts
    version: 0.34.0
    releaseName: nack
    namespace: nats
    includeCRDs: true
    valuesInline:
      # watch all namespaces (in mutli-cluster setup change to onespace only)
      namespaced: false
      jetstream:
        nats:
          url: nats://nats:4222
